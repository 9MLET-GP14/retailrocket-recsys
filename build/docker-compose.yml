name: retailrocket-recsys

services:
  # ── MLflow Tracking Server ──────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.13.0
    ports:
      - "127.0.0.1:6060:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts mlflow:5000,localhost:6060,127.0.0.1:6060
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 60s

  # ── Training Job ────────────────────────────────────────────────────────────
  training:
    build:
      context: ..
      dockerfile: build/Dockerfile
      target: runtime
    volumes:
      - ../data:/app/data
      - ../models:/app/models
    env_file:
      - ../.env
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    command: python scripts/train.py

  # ── Recommendation API ──────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: build/Dockerfile
      target: api
    ports:
      - "127.0.0.1:6061:6061"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6061/health')"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 60s

volumes:
  mlflow_data:
