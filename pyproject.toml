[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retailrocket-recsys"
version = "0.1.0"
description = "E-commerce recommendation system based on RetailRocket user behavior"
authors = [{name = "9MLET-GP14"}]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.3",
    "scikit-learn>=1.5",
    "mlflow>=2.13",
    "dvc>=3.51",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.10",
    "python-dotenv>=1.0",
    "kagglehub>=0.3",
    "torch>=2.2",
    "yellowbrick>=1.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pre-commit>=3.7",
]
jupyter = [
    "ipykernel>=6.29",
    "notebook>=7.2",
    "jupyterlab>=4.2",
]
intel-gpu = [
    "torch-directml",
]


[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "D"]
ignore = ["D100", "D104", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.hatch.build.targets.wheel]
packages = ["src"]
