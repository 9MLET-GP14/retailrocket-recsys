[tool.poetry]
name = "retailrocket-recsys"
version = "0.1.0"
description = "E-commerce recommendation system based on RetailRocket user behavior"
authors = ["Daniel Landi"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
torch = "^2.3"
scikit-learn = "^1.5"
mlflow = "^2.13"
dvc = "^3.51"
pandas = "^2.2"
numpy = "^1.26"
pydantic-settings = "^2.3"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
ruff = "^0.4"
pre-commit = "^3.7"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "D"]
ignore = ["D100", "D104", "ANN101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
